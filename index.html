<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120708">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swaradhana × Senara — Hand Frame</title>
<style>
  :root { --bg:#120708; --fg:#fff5ee; --accent:#e8b84a; --red:#8e1f22; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    overscroll-behavior:none; touch-action:manipulation; -webkit-user-select:none; user-select:none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas#out { max-width:100vw; max-height:100vh; max-height:100dvh; display:block; }
  .credit { font-size:12px; letter-spacing:.18em; font-weight:700; color:var(--accent); }
  video { display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; text-align:center; padding:24px;
    background:radial-gradient(circle at 50% 40%, #5a1416 0%, var(--bg) 70%); z-index:5; }
  #start h1 { margin:0; font-size:clamp(28px,5vw,52px); letter-spacing:.02em; }
  #start h1 span { color:var(--accent); }
  #start p { margin:0; max-width:520px; opacity:.85; line-height:1.5; }
  button, label.btn { font:inherit; font-size:15px; border:1px solid rgba(255,255,255,.25);
    background:rgba(20,10,10,.75); color:var(--fg); padding:9px 14px; border-radius:999px;
    cursor:pointer; backdrop-filter:blur(6px); }
  button:hover, label.btn:hover { border-color:var(--accent); }
  #go { font-size:18px; padding:14px 28px; background:var(--accent); color:#2a0d0e; border:none; font-weight:600; }
  #status { font-size:14px; opacity:.8; min-height:1.2em; }
  #bar { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none;
    gap:8px; flex-wrap:wrap; justify-content:center; z-index:4; width:max-content; max-width:calc(100vw - 16px); }
  #bar input { display:none; }
  #help { position:fixed; left:calc(16px + env(safe-area-inset-left)); top:calc(14px + env(safe-area-inset-top));
    font-size:14px; line-height:1.55; max-width:calc(100vw - 150px);
    text-shadow:0 1px 3px #000; z-index:4; display:none; pointer-events:none; }
  #help b { color:var(--accent); }
  @media (max-width:600px) {
    #bar { gap:6px; bottom:calc(10px + env(safe-area-inset-bottom)); }
    button, label.btn { font-size:13px; padding:9px 12px; }
    #help { font-size:12px; left:calc(10px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="out"></canvas></div>
<video id="video" playsinline muted></video>

<div id="start">
  <h1>Swaradhana <span>×</span> Senara</h1>
  <p>Make a frame with both hands (thumbs + index fingers). Pinch <b>thumb + middle finger</b> to change the filter, or show the poster inside your fingers.</p>
  <button id="go">Start camera</button>
  <div id="status"></div>
  <div class="credit">CREATED BY HILMI</div>
</div>

<div id="help"></div>
<div id="bar">
  <button id="prev">◀ Prev</button>
  <button id="next">Next ▶</button>
  <button id="posterBtn">Poster</button>
  <label class="btn">Change poster…<input type="file" id="file" accept="image/*"></label>
  <button id="snap">Screenshot</button>
  <button id="helpBtn">Hide help</button>
</div>

// thermal LUT (black -> purple -> red -> orange -> yellow -> white)
const LUT = (() => {
  const stops=[[0,[0,0,4]],[.25,[87,16,110]],[.5,[188,55,84]],[.72,[249,142,9]],[.9,[252,255,164]],[1,[255,255,255]]];
  const t=new Uint8Array(256*3);
  for (let i=0;i<256;i++){ const v=i/255; let k=0; while(k<stops.length-2 && v>stops[k+1][0]) k++;
    const [a,ca]=stops[k],[b,cb]=stops[k+1], f=(v-a)/(b-a);
    for(let c=0;c<3;c++) t[i*3+c]=ca[c]+(cb[c]-ca[c])*f; }
  return t; })();
const gray=(d,i)=>(d[i]*.299+d[i+1]*.587+d[i+2]*.114);

function pixelOp(x,y,w,h,fn){ const im=sctx.getImageData(x,y,w,h); fn(im.data,w,h); fctx.putImageData(im,x,y); }

const FILTERS = {
  "INVERT":   (x,y,w,h)=>pixelOp(x,y,w,h,d=>{ for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} }),
  "THERMAL":  (x,y,w,h)=>pixelOp(x,y,w,h,d=>{ for(let i=0;i<d.length;i+=4){const g=gray(d,i)|0;d[i]=LUT[g*3];d[i+1]=LUT[g*3+1];d[i+2]=LUT[g*3+2];} }),
  "NEON EDGES":(x,y,w,h)=>pixelOp(x,y,w,h,(d,w,h)=>{
      const g=new Float32Array(w*h); for(let i=0,j=0;i<d.length;i+=4,j++) g[j]=gray(d,i);
      for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=0;}
      for(let yy=1;yy<h-1;yy++) for(let xx=1;xx<w-1;xx++){
        const p=yy*w+xx;
        const gx=-g[p-w-1]-2*g[p-1]-g[p+w-1]+g[p-w+1]+2*g[p+1]+g[p+w+1];
        const gy=-g[p-w-1]-2*g[p-w]-g[p-w+1]+g[p+w-1]+2*g[p+w]+g[p+w+1];
        const m=Math.min(255,Math.hypot(gx,gy)*1.2);
        if(m>70){const i=p*4; d[i]=255; d[i+1]=80; d[i+2]=255;} } }),
  "PIXEL":    (x,y,w,h)=>{ const b=18; tiny.width=Math.max(1,w/b|0); tiny.height=Math.max(1,h/b|0);
      tctx.imageSmoothingEnabled=true; tctx.drawImage(src,x,y,w,h,0,0,tiny.width,tiny.height);
      fctx.imageSmoothingEnabled=false; fctx.drawImage(tiny,0,0,tiny.width,tiny.height,x,y,w,h); },
  "RGB SPLIT":(x,y,w,h)=>{ const s=14; const im=sctx.getImageData(x,y,w,h), d=im.data, o=new Uint8ClampedArray(d);
      for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){ const i=(yy*w+xx)*4;
        const xr=Math.max(0,xx-s), xb=Math.min(w-1,xx+s);
        o[i]=d[(yy*w+xr)*4]; o[i+2]=d[(yy*w+xb)*4+2]; }
      im.data.set(o); fctx.putImageData(im,x,y); },
  "POSTERIZE":(x,y,w,h)=>pixelOp(x,y,w,h,d=>{ for(let i=0;i<d.length;i+=4) for(let c=0;c<3;c++){
        let v=(d[i+c]>>6)*64+32; d[i+c]=v<128? v*0.8 : Math.min(255,v*1.15);} }),
  "B&W":      (x,y,w,h)=>pixelOp(x,y,w,h,d=>{ for(let i=0;i<d.length;i+=4){let g=gray(d,i); g=(g-128)*1.4+128; d[i]=d[i+1]=d[i+2]=g;} }),
  "SEPIA":    (x,y,w,h)=>pixelOp(x,y,w,h,d=>{ for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];
        d[i]=r*.393+g*.769+b*.189; d[i+1]=r*.349+g*.686+b*.168; d[i+2]=r*.272+g*.534+b*.131;} }),
  "HALFTONE": (x,y,w,h)=>{ const c=10; tiny.width=Math.max(1,w/c|0); tiny.height=Math.max(1,h/c|0);
      tctx.drawImage(src,x,y,w,h,0,0,tiny.width,tiny.height);
      const d=tctx.getImageData(0,0,tiny.width,tiny.height).data;
      fctx.fillStyle="#0f0f0f"; fctx.fillRect(x,y,w,h); fctx.fillStyle="#fae65a";
      for(let j=0;j<tiny.height;j++) for(let i=0;i<tiny.width;i++){
        const r=gray(d,(j*tiny.width+i)*4)/255*c/2; if(r<.4) continue;
        fctx.beginPath(); fctx.arc(x+i*c+c/2,y+j*c+c/2,r,0,Math.PI*2); fctx.fill(); } },
};

// ---------------- geometry ----------------
function orderQuad(p){
  const cx=(p[0][0]+p[1][0]+p[2][0]+p[3][0])/4, cy=(p[0][1]+p[1][1]+p[2][1]+p[3][1])/4;
  const s=[...p].sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let k=0; for(let i=1;i<4;i++) if(s[i][0]+s[i][1]<s[k][0]+s[k][1]) k=i;
  return [0,1,2,3].map(i=>s[(i+k)%4]);
}
function area(q){ let a=0; for(let i=0;i<4;i++){const [x1,y1]=q[i],[x2,y2]=q[(i+1)%4]; a+=x1*y2-x2*y1;} return Math.abs(a)/2; }
function quadPath(c,q){ c.beginPath(); c.moveTo(q[0][0],q[0][1]); for(let i=1;i<4;i++) c.lineTo(q[i][0],q[i][1]); c.closePath(); }

// homography from unit square (u,v in [0,1]) to quad
function homography(q){
  const A=[], B=[]; const S=[[0,0],[1,0],[1,1],[0,1]];
  for(let i=0;i<4;i++){ const [u,v]=S[i], [x,y]=q[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); B.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); B.push(y); }
  for(let c=0;c<8;c++){ let m=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r;
    [A[c],A[m]]=[A[m],A[c]]; [B[c],B[m]]=[B[m],B[c]];
    for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/A[c][c];
      for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; B[r]-=f*B[c]; } }
  const h=B.map((b,i)=>b/A[i][i]);
  return (u,v)=>{ const w=h[6]*u+h[7]*v+1; return [(h[0]*u+h[1]*v+h[2])/w,(h[3]*u+h[4]*v+h[5])/w]; };
}
function drawTri(img,s0,s1,s2,d0,d1,d2){
  const cx=(d0[0]+d1[0]+d2[0])/3, cy=(d0[1]+d1[1]+d2[1])/3, g=p=>{const dx=p[0]-cx,dy=p[1]-cy,l=Math.hypot(dx,dy)||1;return [p[0]+dx/l*.8,p[1]+dy/l*.8];};
  const e0=g(d0),e1=g(d1),e2=g(d2);
  ctx.save(); ctx.beginPath(); ctx.moveTo(...e0); ctx.lineTo(...e1); ctx.lineTo(...e2); ctx.closePath(); ctx.clip();
  const du1=s1[0]-s0[0], dv1=s1[1]-s0[1], du2=s2[0]-s0[0], dv2=s2[1]-s0[1];
  const dx1=d1[0]-d0[0], dy1=d1[1]-d0[1], dx2=d2[0]-d0[0], dy2=d2[1]-d0[1];
  const det=du1*dv2-du2*dv1; if(Math.abs(det)<1e-9){ctx.restore();return;}
  const a=(dx1*dv2-dx2*dv1)/det, c=(dx2*du1-dx1*du2)/det, b=(dy1*dv2-dy2*dv1)/det, d=(dy2*du1-dy1*du2)/det;
  ctx.transform(a,b,c,d,d0[0]-a*s0[0]-c*s0[1],d0[1]-b*s0[0]-d*s0[1]);
  ctx.drawImage(img,0,0); ctx.restore();
}
function drawPoster(q){
  if(!poster.complete || !poster.naturalWidth) return;
  const H=homography(q), W=poster.naturalWidth, Hh=poster.naturalHeight, N=10;
  ctx.save(); quadPath(ctx,q); ctx.clip();
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N,v0=j/N,v1=(j+1)/N;
    const p00=H(u0,v0),p10=H(u1,v0),p11=H(u1,v1),p01=H(u0,v1);
    const s00=[u0*W,v0*Hh],s10=[u1*W,v0*Hh],s11=[u1*W,v1*Hh],s01=[u0*W,v1*Hh];
    drawTri(poster,s00,s10,s11,p00,p10,p11); drawTri(poster,s00,s11,s01,p00,p11,p01);
  }
  ctx.restore();
}

// ---------------- UI drawing ----------------
// canvas px per screen px, so UI stays readable when a big canvas is shrunk onto a phone
let ui=1;
function drawFrameUI(q,label){
  const u=ui;
  ctx.save();
  ctx.shadowColor="rgba(255,255,255,.9)"; ctx.shadowBlur=14*u; ctx.lineWidth=3*u; ctx.strokeStyle="#fff";
  quadPath(ctx,q); ctx.stroke(); ctx.shadowBlur=0;
  for(const [x,y] of q){ ctx.beginPath(); ctx.arc(x,y,7*u,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.lineWidth=1.5*u; ctx.strokeStyle="#222"; ctx.stroke(); }
  ctx.font=`600 ${20*u}px system-ui, sans-serif`; const tw=ctx.measureText(label).width;
  const x=Math.min(q[0][0], out.width-tw-8*u), y=Math.max(30*u,q[0][1]-14*u);
  ctx.fillStyle="rgba(20,10,10,.85)"; ctx.fillRect(x-8*u,y-22*u,tw+16*u,30*u);
  ctx.fillStyle="#fff"; ctx.fillText(label,x,y); ctx.restore();
}
function drawCredit(){
  const u=ui; ctx.save();
  ctx.font=`700 ${13*u}px system-ui, sans-serif`; ctx.textAlign="right"; ctx.textBaseline="top";
  ctx.shadowColor="#000"; ctx.shadowBlur=4*u; ctx.fillStyle="#e8b84a";
  ctx.fillText("CREATED BY HILMI", out.width-12*u, 12*u); ctx.restore();
}

// ---------------- main loop ----------------
let landmarker, smooth=null, lost=0, pinchDown=false, lastSwitch=0, showHelp=true, lastVT=-1, hands=[];
function nextMode(dir=1){ mode=(mode+dir+MODES.length)%MODES.length; updateHelp(); }
function togglePoster(){ const p=MODES.length-1; if(mode===p) mode=lastFilter; else { lastFilter=mode; mode=p; } updateHelp(); }
function updateHelp(){
  $("help").style.display=showHelp?"block":"none";
  $("help").innerHTML=`<b>MODE: ${MODES[mode]}</b><br>Frame: both hands, thumbs + index fingers<br>Pinch thumb + middle finger: next filter`
    + (TOUCH ? "" : `<br>Keys: Space next · B prev · P poster · S screenshot · H help`);
  $("helpBtn").textContent=showHelp?"Hide help":"Show help";
}

function fitCanvases(){
  const W=video.videoWidth, H=video.videoHeight;
  if(W && (W!==src.width || H!==src.height)){ for(const c of [out,src,fx]){ c.width=W; c.height=H; } smooth=null; }
  ui=Math.max(1, out.width/(out.getBoundingClientRect().width||out.width));
}

function frame(){
  fitCanvases(); // phone rotation swaps the camera's width/height mid-session
  const W=src.width, H=src.height;
  sctx.save(); sctx.translate(W,0); sctx.scale(-1,1); sctx.drawImage(video,0,0,W,H); sctx.restore();

  if(landmarker && video.currentTime!==lastVT){
    lastVT=video.currentTime;
    const r=landmarker.detectForVideo(video, performance.now());
    hands=(r.landmarks||[]).map(lm=>lm.map(p=>[(1-p.x)*W, p.y*H]));
  }
  const now=performance.now();
  let pinching=false;
  for(const h of hands){ const s=Math.hypot(h[WRIST][0]-h[MID_MCP][0],h[WRIST][1]-h[MID_MCP][1])+1e-6;
    if(Math.hypot(h[THUMB][0]-h[MIDDLE][0],h[THUMB][1]-h[MIDDLE][1])/s<0.35) pinching=true; }
  if(pinching && !pinchDown && now-lastSwitch>600){ nextMode(1); lastSwitch=now; }
  pinchDown=pinching;

  let q=null;
  if(hands.length===2){ const c=orderQuad([hands[0][THUMB],hands[0][INDEX],hands[1][THUMB],hands[1][INDEX]]);
    if(area(c)>0.01*W*H) q=c; }
  if(q){ smooth = smooth ? q.map((p,i)=>[.55*p[0]+.45*smooth[i][0], .55*p[1]+.45*smooth[i][1]]) : q; lost=0; }
  else if(++lost>6) smooth=null;

  ctx.drawImage(src,0,0);
  const name=MODES[mode];
  if(smooth){
    if(name==="POSTER") drawPoster(smooth);
    else {
      let x0=W,y0=H,x1=0,y1=0; for(const [x,y] of smooth){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
      x0=Math.max(0,x0|0); y0=Math.max(0,y0|0); x1=Math.min(W,Math.ceil(x1)); y1=Math.min(H,Math.ceil(y1));
      if(x1-x0>4 && y1-y0>4){ FILTERS[name](x0,y0,x1-x0,y1-y0);
        ctx.save(); quadPath(ctx,smooth); ctx.clip(); ctx.drawImage(fx,x0,y0,x1-x0,y1-y0,x0,y0,x1-x0,y1-y0); ctx.restore(); }
    }
    drawFrameUI(smooth,name);
  } else {
    ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    for(const h of hands) for(const i of [THUMB,INDEX]){ ctx.beginPath(); ctx.arc(h[i][0],h[i][1],6*ui,0,Math.PI*2); ctx.stroke(); }
  }
  drawCredit();
  requestAnimationFrame(frame);
}

async function start(){
  const st=$("status"); $("go").disabled=true;
  try{
    st.textContent="Asking for camera…";
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("Camera needs HTTPS and a modern browser (Safari on iPhone, Chrome on Android)");
    // ponytail: lower res on phones keeps per-pixel filters smooth; raise if newer phones handle more
    const [cw,ch]=TOUCH?[960,540]:[1280,720];
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:cw},height:{ideal:ch},facingMode:"user"},audio:false});
    video.srcObject=stream; await video.play();
    fitCanvases();
    st.textContent="Loading hand tracking…";
    const files=await FilesetResolver.forVisionTasks(WASM);
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numHands:2,
      minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
    try { landmarker=await HandLandmarker.createFromOptions(files,opts("GPU")); }
    catch { landmarker=await HandLandmarker.createFromOptions(files,opts("CPU")); }
    $("start").style.display="none"; $("bar").style.display="flex"; updateHelp();
    requestAnimationFrame(frame);
  }catch(e){
    console.error(e); $("go").disabled=false;
    st.textContent = e && e.name==="NotAllowedError"
      ? "Camera blocked. Allow camera access for this page in your browser, then try again."
      : "Couldn't start: "+(e.message||e)+". Use Chrome, and make sure you're online.";
  }
}

$("go").onclick=start;
$("next").onclick=()=>nextMode(1);
$("prev").onclick=()=>nextMode(-1);
$("posterBtn").onclick=togglePoster;
$("helpBtn").onclick=()=>{showHelp=!showHelp;updateHelp();};
$("snap").onclick=snap;
$("file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image();
  im.onload=()=>{ poster=im; mode=MODES.length-1; updateHelp(); }; im.src=URL.createObjectURL(f); };
// phones: share sheet ("Save Image" → Photos); desktop: plain download
function snap(){
  const name=`swaradhana_${Date.now()}.png`;
  out.toBlob(async blob=>{
    const file=new File([blob],name,{type:"image/png"});
    if(TOUCH && navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; } }
    const a=document.createElement("a"); a.download=name; a.href=URL.createObjectURL(blob); a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },"image/png");
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k===" "||k==="n"){ e.preventDefault(); nextMode(1); }
  else if(k==="b") nextMode(-1);
  else if(k==="p") togglePoster();
  else if(k==="s") snap();
  else if(k==="h"){ showHelp=!showHelp; updateHelp(); }
});

// test hook (no camera): window.__demo(canvasImage, quad, modeName)
window.__demo=(img,quad,m)=>{ for(const c of [out,src,fx]){c.width=img.width;c.height=img.height;}
  sctx.drawImage(img,0,0); ctx.drawImage(src,0,0); mode=MODES.indexOf(m);
  const q=orderQuad(quad);
  if(m==="POSTER") drawPoster(q); else { let x0=1e9,y0=1e9,x1=0,y1=0; for(const [x,y] of q){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
    x0|=0;y0|=0;x1=Math.ceil(x1);y1=Math.ceil(y1); FILTERS[m](x0,y0,x1-x0,y1-y0);
    ctx.save(); quadPath(ctx,q); ctx.clip(); ctx.drawImage(fx,x0,y0,x1-x0,y1-y0,x0,y0,x1-x0,y1-y0); ctx.restore(); }
  $("start").style.display="none"; ui=Math.max(1,out.width/(out.getBoundingClientRect().width||out.width));
  drawFrameUI(q,m); drawCredit(); };
</script>
